[project]
name = "pajak-simulator-backend"
version = "0.1.0"
description = "Tax administration learning simulator — backend (Phase 1 foundation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "passlib[bcrypt]>=1.7.4",
    # Pinned <4.1: passlib 1.7.4 reads bcrypt.__about__.__version__, removed in 4.1+.
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Default rules (E, F) plus import sorting (I) and a few sensible extras.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migration files: don't fight the generator over line length.
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
